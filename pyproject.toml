[project]
name = "edit2forensics"
version = "0.1.0"
description = "EditSleuth Dataset Generation"
readme = "README.md"
authors = [
    { name = "Pyone MaungMaung", email = "fugokidi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "Pillow>=10.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pydantic>=2.5",
    "datasets>=2.19",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "lpips>=0.1.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "xformers>=0.0.35",
    "scipy>=1.11",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "trl>=0.11.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "gdown>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true  # Prevents other packages from accidentally using this index

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edit2forensics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "huggingface-hub>=1.11.0",
    "ipdb>=0.13.13",
    "pytest>=9.0.3",
]
